<style>
html { background: #0B1315; }
body {
  margin: 0;
  background: #0B1315;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
/* respect the notch and the home indicator when launched standalone */
#root {
  padding-top: calc(22px + env(safe-area-inset-top));
  padding-bottom: calc(30px + env(safe-area-inset-bottom));
  padding-left: calc(16px + env(safe-area-inset-left));
  padding-right: calc(16px + env(safe-area-inset-right));
  min-height: 100vh;
  min-height: 100dvh;
}

  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  #root {
    --bg:        #0B1315;
    --panel:     #101B1E;
    --panel-2:   #16262A;
    --line:      #1F353A;
    --line-soft: #16272B;
    --ink:       #DCE8E6;
    --dim:       #6E8C8E;
    --amber:     #F0A83C;
    --amber-dp:  #B87613;
    --cyan:      #46B7C2;
    --red:       #E0563D;

    --display: 'Oswald', 'Arial Narrow', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
    --body: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;

    background: var(--bg);
    background-image:
      repeating-linear-gradient(to bottom, rgba(255,255,255,.014) 0 1px, transparent 1px 3px),
      radial-gradient(120% 80% at 50% -10%, rgba(70,183,194,.09), transparent 60%);
    color: var(--ink);
    font-family: var(--body);
    padding: 22px 16px 30px;
  }
  #root * { box-sizing: border-box; }
  .shell { max-width: 860px; margin: 0 auto; }

  /* ---------- header ---------- */
  .hdr {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .28em;
    color: var(--cyan); display: flex; align-items: center; gap: 8px;
  }
  .blip {
    width: 6px; height: 6px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan); animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .hdr h1 {
    font-family: var(--display); font-weight: 600; margin: 4px 0 0;
    font-size: clamp(34px, 9vw, 54px); line-height: .9; letter-spacing: .05em;
  }
  .hdr-r { text-align: right; flex-shrink: 0; }
  .stamp {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--dim);
  }
  .stamp.dim { opacity: .65; }
  .ratio {
    font-family: var(--display); font-weight: 600; color: var(--amber);
    font-size: clamp(26px, 8vw, 40px); line-height: 1.05;
  }

  /* ---------- kpi strip ---------- */
  .kpis {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin: 14px 0;
  }
  .kpi {
    background: var(--panel); border: 1px solid var(--line-soft);
    padding: 11px 12px 12px; position: relative;
  }
  .kpi::before {
    content: ''; position: absolute; top: -1px; left: -1px;
    width: 9px; height: 9px;
    border-top: 1px solid var(--cyan); border-left: 1px solid var(--cyan);
  }
  .kpi b {
    display: block; font-family: var(--display); font-weight: 600;
    font-size: clamp(20px, 5.4vw, 30px); line-height: 1; color: var(--ink);
  }
  .kpi b.gold { color: var(--amber); }
  .kpi span {
    display: block; font-family: var(--mono); font-size: 8.5px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
    margin-top: 6px; line-height: 1.35;
  }

  /* ---------- panels ---------- */
  .panel {
    background: var(--panel); border: 1px solid var(--line-soft);
    margin-bottom: 10px;
  }
  .phead {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 9px 13px; border-bottom: 1px solid var(--line-soft);
    background: linear-gradient(to bottom, rgba(255,255,255,.02), transparent);
  }
  .phead h2 {
    font-family: var(--mono); font-weight: 600; font-size: 10px;
    letter-spacing: .24em; margin: 0; color: var(--ink);
  }
  .tag {
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .16em;
    color: var(--dim); text-transform: uppercase;
  }
  .pbody { padding: 13px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .split .panel { margin-bottom: 10px; }

  .noData {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    color: var(--dim); text-transform: uppercase; padding: 22px 0; text-align: center;
    border: 1px dashed var(--line); line-height: 1.7;
  }

  /* ---------- pager ---------- */
  .pager {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .14em;
    color: var(--dim); text-transform: uppercase;
  }
  .pager button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    cursor: pointer; font-size: 8px; padding: 3px 7px; line-height: 1;
  }
  .pager button:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  .pager button:disabled { opacity: .25; cursor: default; }

  /* ---------- habit rows ---------- */
  .row { padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
  .row:last-child { border-bottom: none; padding-bottom: 2px; }
  .row-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .name {
    font-family: var(--body); font-weight: 500; font-size: 13.5px; flex: 1; min-width: 0;
    background: none; border: none; border-bottom: 1px solid transparent;
    color: var(--ink); padding: 1px 0;
  }
  .name:hover { border-bottom-color: var(--line); }
  .name:focus { outline: none; border-bottom-color: var(--cyan); }
  .streak {
    font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1;
    color: var(--amber); flex-shrink: 0;
  }
  .streak.zero { color: var(--dim); }
  .streak small {
    font-family: var(--mono); font-weight: 400; font-size: 8px;
    letter-spacing: .14em; margin-left: 3px; color: var(--dim); text-transform: uppercase;
  }
  .kill {
    background: none; border: none; cursor: pointer; color: var(--dim);
    font-size: 14px; line-height: 1; padding: 2px 3px; flex-shrink: 0;
  }
  .kill:hover { color: var(--red); }

  .ribbon { display: flex; gap: 2px; }
  .cell {
    flex: 1 1 0; min-width: 0; aspect-ratio: 1 / 1.2;
    border: 1px solid var(--line); background: rgba(255,255,255,.012);
    padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color .12s ease, background-color .12s ease;
  }
  .cell svg { width: 76%; height: 76%; display: block; }
  .cell .glyph { fill: var(--dim); opacity: .16; }
  .cell:hover:not(.future) { border-color: var(--cyan); }
  .cell:hover:not(.future) .glyph { opacity: .4; }
  .cell.on { border-color: var(--amber-dp); background: rgba(240,168,60,.09); }
  .cell.on .glyph { fill: var(--amber); opacity: 1; }
  .cell.seal { border-color: var(--amber); background: rgba(240,168,60,.2); }
  .cell.seal .glyph { fill: #FFD98A; opacity: 1; }
  .cell.today { border-color: var(--cyan); }
  .cell.today.on { border-color: var(--amber); }
  .cell.future { cursor: default; opacity: .3; border-style: dashed; }
  .cell.future .glyph { opacity: 0; }
  .cell:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  @keyframes stamp {
    0% { transform: scale(.2) rotate(-30deg); opacity: 0; }
    62% { transform: scale(1.25) rotate(6deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }
  .cell.on.fresh svg { animation: stamp .3s cubic-bezier(.2,.9,.3,1.4); }

  .scale {
    display: flex; justify-content: space-between; margin-top: 5px;
    font-family: var(--mono); font-size: 8px; letter-spacing: .12em;
    color: var(--dim); text-transform: uppercase;
  }

  /* ---------- bar chart ---------- */
  .bar-row { margin-bottom: 10px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 9.5px; margin-bottom: 4px; gap: 8px;
  }
  .bar-top .lbl { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-top .val { color: var(--dim); flex-shrink: 0; letter-spacing: .08em; }
  .bar-track { height: 7px; background: var(--panel-2); border: 1px solid var(--line-soft); }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--amber-dp), var(--amber)); }
  .bar-fill.cool { background: linear-gradient(90deg, #1F6A72, var(--cyan)); }

  /* ---------- footer ---------- */
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .add-wrap { display: flex; gap: 7px; flex: 1; min-width: 210px; }
  #newHabit {
    flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px;
    padding: 8px 10px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line);
  }
  #newHabit::placeholder { color: var(--dim); }
  #newHabit:focus { outline: none; border-color: var(--cyan); }
  #addBtn {
    font-family: var(--mono); font-size: 10px; letter-spacing: .18em; cursor: pointer;
    padding: 8px 15px; background: var(--amber); color: #12191A;
    border: 1px solid var(--amber); font-weight: 600;
  }
  #addBtn:hover { background: #FFC163; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .ghost {
    font-family: var(--mono); font-size: 9px; letter-spacing: .16em; cursor: pointer;
    padding: 8px 11px; background: transparent; color: var(--dim);
    border: 1px solid var(--line);
  }
  .ghost:hover { color: var(--cyan); border-color: var(--cyan); }
  .ghost.danger:hover { color: var(--red); border-color: var(--red); }

  .status {
    font-family: var(--mono); font-size: 10px; color: var(--amber);
    margin-top: 11px; min-height: 13px; letter-spacing: .06em;
  }
  .storage-note {
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--dim); margin-top: 3px;
  }
  .storage-note b { color: var(--cyan); font-weight: 500; }
  .storage-note.warn b { color: var(--red); }

  @media (max-width: 620px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .split { grid-template-columns: 1fr; }
    .ribbon { gap: 1.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #root *, .cell.on.fresh svg, .blip { animation: none !important; transition: none !important; }
  }

</style>
</head>
<body>

<div id="root">
  <div class="shell">

    <header class="hdr">
      <div class="hdr-l">
        <div class="eyebrow">HABIT TELEMETRY <span class="blip"></span></div>
        <h1>LOGBOOK</h1>
      </div>
      <div class="hdr-r">
        <div class="stamp" id="datestamp"></div>
        <div class="ratio" id="todayCount">&mdash;</div>
        <div class="stamp dim">CLEARED TODAY</div>
      </div>
    </header>

    <section class="kpis" id="kpis"></section>

    <section class="panel">
      <div class="phead"><h2>CONSISTENCY</h2><span class="tag" id="consTag"></span></div>
      <div class="pbody" id="consChart"></div>
    </section>

    <section class="panel">
      <div class="phead">
        <h2>MATRIX</h2>
        <div class="pager">
          <button id="prevPage" type="button" aria-label="Previous page">&#9664;</button>
          <span id="pageLabel"></span>
          <button id="nextPage" type="button" aria-label="Next page">&#9654;</button>
        </div>
      </div>
      <div class="pbody">
        <div id="rows"></div>
        <div class="empty" id="empty" hidden>No habits loaded. Add one below to begin logging.</div>
      </div>
    </section>

    <div class="split">
      <section class="panel">
        <div class="phead"><h2>PER-HABIT RATE</h2><span class="tag">LIFETIME</span></div>
        <div class="pbody" id="rateChart"></div>
      </section>
      <section class="panel">
        <div class="phead"><h2>WEEKDAY LOAD</h2><span class="tag" id="dowTag"></span></div>
        <div class="pbody" id="dowChart"></div>
      </section>
    </div>

    <footer class="foot">
      <div class="add-wrap">
        <input id="newHabit" type="text" maxlength="28" placeholder="new habit&hellip;" aria-label="New habit name" />
        <button id="addBtn" type="button">ADD</button>
      </div>
      <div class="tools">
        <button id="exportBtn" class="ghost" type="button">EXPORT</button>
        <button id="importBtn" class="ghost" type="button">IMPORT</button>
        <button id="resetBtn" class="ghost danger" type="button">WIPE</button>
      </div>
      <input id="importFile" type="file" accept="application/json,.json" hidden />
    </footer>

    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="storage-note" id="storageNote"></div>
  </div>
</div>

<script>

(function () {
  var KEY = 'habit-logbook:v1';
  var PAGE = 28;
  var SCHEMA = 3;
  var DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="glyph" d="M12 2.1l3.02 6.35 6.86.96-4.99 4.9 1.22 6.87L12 17.83l-6.11 3.35 1.22-6.87-4.99-4.9 6.86-.96z"/></svg>';

  var state = { habits: [], log: {}, startDate: null, schema: SCHEMA };
  var page = 0;
  var freshCell = null;

  var SEED = ['Wake up at 6:00', 'Workout', 'Manwaaz', 'Protein target', 'Read 20 min', 'Sleep 7h+'];

  /* ---------- dates ---------- */
  function iso(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function noon(s) { return new Date(s + 'T12:00:00'); }
  function shift(n, from) {
    var d = from ? noon(from) : new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + n);
    return d;
  }
  function today() { return iso(shift(0)); }
  function daysBetween(a, b) { return Math.round((noon(b) - noon(a)) / 86400000); }
  function uid() { return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function say(m) { document.getElementById('status').textContent = m || ''; }
  function pretty(d) { return noon(d).toLocaleDateString(undefined, { day: '2-digit', month: 'short' }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function lastPage() { return Math.floor(daysBetween(state.startDate, today()) / PAGE); }
  function pageDates(p) {
    var o = [];
    for (var i = 0; i < PAGE; i++) o.push(iso(shift(p * PAGE + i, state.startDate)));
    return o;
  }
  /* every day from day one up to and including today */
  function liveDates() {
    var n = daysBetween(state.startDate, today());
    var o = [];
    for (var i = 0; i <= n; i++) o.push(iso(shift(i, state.startDate)));
    return o;
  }

  function done(id, d) { return !!(state.log[id] && state.log[id][d]); }

  function runEndingAt(id, date) {
    var n = 0;
    for (var i = 0; i < 400; i++) { if (done(id, iso(shift(-i, date)))) n++; else break; }
    return n;
  }
  function currentStreak(id) {
    if (done(id, today())) return runEndingAt(id, today());
    var y = iso(shift(-1));
    return done(id, y) ? runEndingAt(id, y) : 0;
  }
  function bestStreak(id) {
    var days = Object.keys(state.log[id] || {}).filter(function (d) { return state.log[id][d]; }).sort();
    var best = 0, run = 0, prev = null;
    days.forEach(function (d) {
      run = (prev && daysBetween(prev, d) === 1) ? run + 1 : 1;
      if (run > best) best = run;
      prev = d;
    });
    return best;
  }

  /* ---------- storage: Claude viewer -> localStorage -> memory ---------- */
  var store = (function () {
    var hasClaude = !!(window.storage && typeof window.storage.get === 'function');
    var hasLocal = (function () {
      try { window.localStorage.setItem('__t', '1'); window.localStorage.removeItem('__t'); return true; }
      catch (e) { return false; }
    })();
    var mem = {};
    var mode = hasClaude ? 'claude' : (hasLocal ? 'local' : 'memory');
    return {
      mode: mode,
      label: mode === 'claude' ? 'Claude session' : mode === 'local' ? 'This browser' : 'NOT SAVING \u2014 export a backup',
      async get(k) {
        if (mode === 'claude') { var r = await window.storage.get(k); return r ? r.value : null; }
        if (mode === 'local') return window.localStorage.getItem(k);
        return mem[k] || null;
      },
      async set(k, v) {
        if (mode === 'claude') return window.storage.set(k, v);
        if (mode === 'local') return window.localStorage.setItem(k, v);
        mem[k] = v;
      },
      async del(k) {
        if (mode === 'claude') return window.storage.delete(k);
        if (mode === 'local') return window.localStorage.removeItem(k);
        delete mem[k];
      }
    };
  })();

  async function save() {
    try { await store.set(KEY, JSON.stringify(state)); }
    catch (e) { say('Save failed. Export a backup before closing.'); }
  }
  function adopt(raw) {
    var p = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!p || !Array.isArray(p.habits)) return false;
    state = { habits: p.habits, log: p.log || {}, startDate: p.startDate || null, schema: p.schema || 1 };
    return true;
  }
  async function load() {
    try { var raw = await store.get(KEY); if (raw) return adopt(raw); }
    catch (e) {}
    return false;
  }

  /* ---------- charts ---------- */
  function dayRate(d) {
    if (!state.habits.length) return 0;
    var n = state.habits.filter(function (h) { return done(h.id, d); }).length;
    return n / state.habits.length;
  }

  function drawConsistency() {
    var host = document.getElementById('consChart');
    var tag = document.getElementById('consTag');
    var live = liveDates().slice(-PAGE);
    tag.textContent = live.length + ' DAY' + (live.length === 1 ? '' : 'S') + ' LOGGED';

    if (live.length < 3) {
      host.innerHTML = '<div class="noData">AWAITING DATA<br>3 days minimum \u2014 ' + (3 - live.length) + ' to go</div>';
      return;
    }

    var W = 600, H = 130, PADL = 26, PADR = 6, PADT = 10, PADB = 18;
    var iw = W - PADL - PADR, ih = H - PADT - PADB;
    var x = function (i) { return PADL + (live.length === 1 ? iw / 2 : (i / (live.length - 1)) * iw); };
    var y = function (v) { return PADT + ih - v * ih; };

    var pts = live.map(function (d, i) { return x(i) + ',' + y(dayRate(d)); });
    var area = 'M' + x(0) + ',' + y(0) + ' L' + pts.join(' L') + ' L' + x(live.length - 1) + ',' + y(0) + ' Z';

    var grid = '';
    [0, .5, 1].forEach(function (v) {
      grid += '<line x1="' + PADL + '" y1="' + y(v) + '" x2="' + (W - PADR) + '" y2="' + y(v) +
              '" stroke="#1F353A" stroke-width="1" stroke-dasharray="2 4"/>' +
              '<text x="0" y="' + (y(v) + 3) + '" fill="#6E8C8E" font-family="IBM Plex Mono, monospace" font-size="9">' +
              (v * 100) + '%</text>';
    });

    var dots = live.map(function (d, i) {
      var r = dayRate(d);
      return '<circle cx="' + x(i) + '" cy="' + y(r) + '" r="' + (r === 1 ? 3.2 : 2) + '" fill="' +
             (r === 1 ? '#F0A83C' : '#46B7C2') + '"/>';
    }).join('');

    var avg = live.reduce(function (s, d) { return s + dayRate(d); }, 0) / live.length;

    host.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Daily completion rate over ' + live.length + ' days">' +
        '<defs><linearGradient id="cfill" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#46B7C2" stop-opacity=".34"/>' +
          '<stop offset="100%" stop-color="#46B7C2" stop-opacity="0"/>' +
        '</linearGradient></defs>' +
        grid +
        '<path d="' + area + '" fill="url(#cfill)"/>' +
        '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#46B7C2" stroke-width="2" stroke-linejoin="round"/>' +
        '<line x1="' + PADL + '" y1="' + y(avg) + '" x2="' + (W - PADR) + '" y2="' + y(avg) +
          '" stroke="#F0A83C" stroke-width="1" stroke-dasharray="5 3" opacity=".75"/>' +
        dots +
        '<text x="' + (W - PADR) + '" y="' + (y(avg) - 5) + '" text-anchor="end" fill="#F0A83C" ' +
          'font-family="IBM Plex Mono, monospace" font-size="9">AVG ' + Math.round(avg * 100) + '%</text>' +
        '<text x="' + PADL + '" y="' + (H - 4) + '" fill="#6E8C8E" font-family="IBM Plex Mono, monospace" font-size="9">' + pretty(live[0]) + '</text>' +
        '<text x="' + (W - PADR) + '" y="' + (H - 4) + '" text-anchor="end" fill="#6E8C8E" font-family="IBM Plex Mono, monospace" font-size="9">' + pretty(live[live.length - 1]) + '</text>' +
      '</svg>';
  }

  function drawRates() {
    var host = document.getElementById('rateChart');
    var live = liveDates();
    if (!state.habits.length) { host.innerHTML = '<div class="noData">NO HABITS</div>'; return; }

    host.innerHTML = state.habits.map(function (h) {
      var hit = live.filter(function (d) { return done(h.id, d); }).length;
      var pct = live.length ? Math.round((hit / live.length) * 100) : 0;
      return '<div class="bar-row">' +
        '<div class="bar-top"><span class="lbl">' + esc(h.name) + '</span>' +
        '<span class="val">' + hit + '/' + live.length + ' \u00B7 ' + pct + '%</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>';
    }).join('');
  }

  function drawWeekday() {
    var host = document.getElementById('dowChart');
    var tag = document.getElementById('dowTag');
    var live = liveDates();
    tag.textContent = live.length >= 7 ? 'AVG BY DAY' : 'LOCKED';

    if (live.length < 7 || !state.habits.length) {
      host.innerHTML = '<div class="noData">NEEDS 7 DAYS<br>' + Math.max(0, 7 - live.length) + ' remaining</div>';
      return;
    }

    var sum = [0,0,0,0,0,0,0], cnt = [0,0,0,0,0,0,0];
    live.forEach(function (d) {
      var k = noon(d).getDay();
      sum[k] += dayRate(d); cnt[k]++;
    });

    host.innerHTML = DOW.map(function (lbl, i) {
      var v = cnt[i] ? sum[i] / cnt[i] : 0;
      var pct = Math.round(v * 100);
      return '<div class="bar-row">' +
        '<div class="bar-top"><span class="lbl">' + lbl + '</span>' +
        '<span class="val">' + (cnt[i] ? pct + '%' : '\u2014') + '</span></div>' +
        '<div class="bar-track"><div class="bar-fill cool" style="width:' + pct + '%"></div></div></div>';
    }).join('');
  }

  /* ---------- render ---------- */
  function render() {
    var dates = pageDates(page);
    var td = today();
    var live = liveDates();

    document.getElementById('datestamp').textContent =
      shift(0).toLocaleDateString(undefined, { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
    var doneToday = state.habits.filter(function (h) { return done(h.id, td); }).length;
    document.getElementById('todayCount').textContent =
      state.habits.length ? doneToday + '/' + state.habits.length : '\u2014';

    var earned = 0;
    state.habits.forEach(function (h) {
      live.forEach(function (d) { if (done(h.id, d)) earned++; });
    });
    var possible = state.habits.length * live.length;
    var rate = possible ? Math.round((earned / possible) * 100) : 0;
    var longest = state.habits.reduce(function (m, h) { return Math.max(m, currentStreak(h.id)); }, 0);
    var record = state.habits.reduce(function (m, h) { return Math.max(m, bestStreak(h.id)); }, 0);

    document.getElementById('kpis').innerHTML =
      '<div class="kpi"><b class="gold">' + earned + '</b><span>Stars earned</span></div>' +
      '<div class="kpi"><b>' + rate + '%</b><span>Overall rate</span></div>' +
      '<div class="kpi"><b>' + longest + '</b><span>Live streak</span></div>' +
      '<div class="kpi"><b>' + record + '</b><span>All-time record</span></div>';

    document.getElementById('pageLabel').textContent =
      'P' + (page + 1) + ' \u00B7 ' + pretty(dates[0]) + '\u2013' + pretty(dates[PAGE - 1]);
    document.getElementById('prevPage').disabled = page === 0;
    document.getElementById('nextPage').disabled = page >= lastPage();

    var rows = document.getElementById('rows');
    rows.innerHTML = '';
    document.getElementById('empty').hidden = state.habits.length > 0;

    state.habits.forEach(function (h) {
      var streak = currentStreak(h.id);
      var row = document.createElement('div');
      row.className = 'row';

      var head = document.createElement('div');
      head.className = 'row-head';

      var name = document.createElement('input');
      name.className = 'name'; name.value = h.name; name.maxLength = 28;
      name.setAttribute('aria-label', 'Habit name');
      name.addEventListener('change', function () {
        h.name = name.value.trim() || h.name;
        save(); render();
      });

      var st = document.createElement('div');
      st.className = 'streak' + (streak ? '' : ' zero');
      st.innerHTML = streak + '<small>D</small>';

      var kill = document.createElement('button');
      kill.className = 'kill'; kill.type = 'button'; kill.textContent = '\u00D7';
      kill.setAttribute('aria-label', 'Remove ' + h.name);
      kill.addEventListener('click', function () {
        if (!confirm('Remove "' + h.name + '" and all its stars?')) return;
        state.habits = state.habits.filter(function (x) { return x.id !== h.id; });
        delete state.log[h.id];
        save(); render(); say('Removed ' + h.name + '.');
      });

      head.appendChild(name); head.appendChild(st); head.appendChild(kill);

      var ribbon = document.createElement('div');
      ribbon.className = 'ribbon';
      dates.forEach(function (d) {
        var future = daysBetween(d, td) < 0;
        var marked = done(h.id, d);
        var run = marked ? runEndingAt(h.id, d) : 0;
        var seal = run > 0 && run % 7 === 0;

        var cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell' + (marked ? ' on' : '') + (seal ? ' seal' : '') +
          (d === td ? ' today' : '') + (future ? ' future' : '') +
          (freshCell === h.id + d ? ' fresh' : '');
        cell.innerHTML = STAR;
        cell.disabled = future;
        cell.title = future ? d + ' \u2014 not yet' : d + (marked ? ' \u2014 star earned' : ' \u2014 unmarked');
        cell.setAttribute('aria-label', h.name + ', ' + d + (future ? ', not yet' : marked ? ', star earned' : ', unmarked'));
        cell.setAttribute('aria-pressed', marked ? 'true' : 'false');
        cell.addEventListener('click', function () {
          if (future) return;
          if (!state.log[h.id]) state.log[h.id] = {};
          if (state.log[h.id][d]) { delete state.log[h.id][d]; freshCell = null; }
          else { state.log[h.id][d] = 1; freshCell = h.id + d; }
          save(); render();
          var s = currentStreak(h.id);
          if (done(h.id, d) && s > 0 && s % 7 === 0) say('\u2605 ' + s + '-day streak on ' + h.name + ' \u2014 sealed.');
          else say('');
          freshCell = null;
        });
        ribbon.appendChild(cell);
      });

      var scale = document.createElement('div');
      scale.className = 'scale';
      scale.innerHTML = '<span>' + pretty(dates[0]) + '</span><span>BEST ' + bestStreak(h.id) + '</span><span>' + pretty(dates[PAGE - 1]) + '</span>';

      row.appendChild(head); row.appendChild(ribbon); row.appendChild(scale);
      rows.appendChild(row);
    });

    drawConsistency();
    drawRates();
    drawWeekday();
  }

  /* ---------- actions ---------- */
  function addHabit(raw) {
    var name = (raw || '').trim();
    if (!name) { say('Name the habit first.'); return; }
    if (state.habits.length >= 10) { say('Ten is the ceiling. Cut one to add another.'); return; }
    state.habits.push({ id: uid(), name: name });
    save(); render(); say('Added ' + name + '.');
  }

  document.getElementById('addBtn').addEventListener('click', function () {
    var i = document.getElementById('newHabit');
    addHabit(i.value); i.value = ''; i.focus();
  });
  document.getElementById('newHabit').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('addBtn').click();
  });
  document.getElementById('prevPage').addEventListener('click', function () { if (page > 0) { page--; render(); } });
  document.getElementById('nextPage').addEventListener('click', function () { if (page < lastPage()) { page++; render(); } });

  document.getElementById('resetBtn').addEventListener('click', async function () {
    if (!confirm('Wipe every habit and every star? This cannot be undone.')) return;
    state = { habits: [], log: {}, startDate: today(), schema: SCHEMA };
    page = 0;
    try { await store.del(KEY); } catch (e) {}
    await save(); render(); say('Wiped. Day one starts today.');
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'habit-logbook-' + today() + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    say('Backup downloaded.');
  });
  document.getElementById('importBtn').addEventListener('click', function () {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = async function () {
      try {
        if (!adopt(r.result)) throw new Error('bad');
        if (!state.startDate) state.startDate = today();
        await save(); page = lastPage(); render();
        say('Backup restored \u2014 ' + state.habits.length + ' habits.');
      } catch (err) { say('That file is not a logbook backup.'); }
    };
    r.readAsText(f); e.target.value = '';
  });

  /* ---------- migration ---------- */
  function migrate() {
    var notes = [];
    state.habits.forEach(function (h) {
      if (/deep\s*work/i.test(h.name)) { h.name = 'Manwaaz'; notes.push('renamed Manwaaz'); }
    });
    if (!state.habits.some(function (h) { return /wake\s*up/i.test(h.name); })) {
      state.habits.unshift({ id: uid(), name: 'Wake up at 6:00' });
      notes.push('added wake-up');
    }
    if (!state.startDate) { state.startDate = today(); notes.push('day one set to today'); }
    state.schema = SCHEMA;
    return notes;
  }

  /* ---------- boot ---------- */
  (async function init() {
    var found = await load();
    if (!found) {
      state.startDate = today();
      state.habits = SEED.map(function (n) { return { id: uid(), name: n }; });
      await save();
      say('Day one is today. Click a name to rename it.');
    } else if (state.schema < SCHEMA) {
      var notes = migrate();
      await save();
      if (notes.length) say('Updated: ' + notes.join(', ') + '.');
    }
    var note = document.getElementById('storageNote');
    note.innerHTML = 'STORAGE: <b>' + store.label + '</b>';
    if (store.mode === 'memory') note.classList.add('warn');

    page = lastPage();
    render();
  })();
})();


/* ---------- installable app wiring ---------- */
(function () {
  var icon192 = document.querySelector('link[rel="icon"]').href;
  var icon512 = document.getElementById('icon512').href;
  var here = location.href.replace(/[^/]*$/, '');
  var manifest = {
    name: 'Habit Logbook',
    short_name: 'Logbook',
    description: 'Daily habit tracker with streaks and telemetry.',
    start_url: location.href,
    scope: here,
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#0B1315',
    theme_color: '#0B1315',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' }
    ]
  };
  try {
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  } catch (e) { /* home-screen bookmark still works without it */ }
})();

</script>
</body>
</html>
